global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'opicnic-app'
    metrics_path: '/actuator/prometheus'
    static_configs:
      # compose 서비스 이름(app)으로 잡는다. container_name(opicnic_app)을 쓰면 그 이름이
      # 그대로 Host 헤더에 실리는데, 톰캣이 도메인 이름의 언더스코어를 거부해 400이 난다.
      # (같은 URL에 Host만 바꿔 재현: opicnic_app:8080 -> 400, localhost -> 200)
      - targets: ['app:8080']
