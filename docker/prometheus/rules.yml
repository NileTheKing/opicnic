# 알림은 결과 지표(채점 실패율) 하나만. CPU·힙 같은 원인 지표엔 걸지 않는다 — 2026-07-31·08-31 모델 소멸
# 장애 때 그 지표들은 전부 정상이었다. 실제 장애를 잡을 수 있는 건 외부 호출 outcome뿐이다.
groups:
  - name: opicnic-scoring
    rules:
      - alert: ScoringFailureRateHigh
        # 5분 창에서 채점(kind=score) 호출이 3건 이상이고, 그 중 outcome!=ok가 50% 이상.
        # 3건 미만은 표본이 적어 무시(사용자 1명의 429 한 번으로 울리지 않게).
        # 비율을 `and`의 왼쪽에 둔다 — `and`는 왼쪽 값을 돌려주므로, 반대로 두면 $value가 호출 건수가 된다.
        expr: |
          (
            sum(increase(opicnic_external_call_seconds_count{provider="groq", kind="score", outcome!="ok"}[5m]))
            /
            sum(increase(opicnic_external_call_seconds_count{provider="groq", kind="score"}[5m]))
          ) >= 0.5
          and
          sum(increase(opicnic_external_call_seconds_count{provider="groq", kind="score"}[5m])) >= 3
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "채점 실패율 50% 이상 (5분 창, 2분 지속)"
          description: "Groq 채점 호출 실패율이 {{ $value | humanizePercentage }}. 먼저 GET https://api.groq.com/openai/v1/models 로 모델 생존 확인 (PROJECT.md 참고)."

      - alert: WorkerItemFinalFailureRatioHigh
        # 위 ScoringFailureRateHigh는 "Groq 호출이 실패했다"는 의존성 신호다. 재시도로 회복되면 사용자는 아무것도 못 느낀다.
        # 사용자가 실제로 보는 증상은 "문항이 FAILED로 끝났다"는 것 — 녹음 파일 문제(즉시), LLM 형식 오류 3회, 재시도 예산(30분) 초과.
        # ScoringWorker.process()의 outcome 라벨: done(성공) / retry(재시도 예정, 카운트 안 함) / failed(최종 실패).
        # 완료된(끝난) 문항 중 failed 비율 20% 이상. 10분 창, 완료 3건 미만은 표본이 적어 무시(사용자 1명분으로 안 울리게).
        expr: |
          (
            sum(increase(opicnic_worker_items_total{outcome="failed"}[10m]))
            /
            sum(increase(opicnic_worker_items_total{outcome=~"done|failed"}[10m]))
          ) >= 0.2
          and
          sum(increase(opicnic_worker_items_total{outcome=~"done|failed"}[10m])) >= 3
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "채점 문항 최종 실패율 20% 이상 (10분 창, 5분 지속)"
          description: "완료된 채점 문항 중 {{ $value | humanizePercentage }}이 FAILED로 끝남(파일 문제·형식 오류·재시도 예산 초과). 사용자가 실제로 실패 카드를 본다."

      - alert: WorkerStalled
        # 비동기로 옮기면서 생긴 위험: 워커가 멈춰도 사용자는 에러를 못 본다 — 그냥 계속 기다린다(무한 QUEUED).
        # 큐에 대기 중인 문항이 있는데(queued>0) 5분 동안 처리 시도(done·retry·failed)가 하나도 없으면 워커가 멈춘 것.
        # retry도 활동으로 센다 — 재시도 예산이 30분이라 제공자 장애 중엔 끝나는 문항 없이 재시도만 돈다. 그건 멈춤이 아니라
        # 장애이고, 장애는 ScoringFailureRateHigh가 잡는다(백오프 상한 60s·서킷 30s라 장애 중에도 분당 시도는 있다).
        # 양쪽 다 sum()으로 라벨을 없앤다 — gauge엔 job/instance 라벨이 붙어 있어 sum()과 `and` 매칭이 안 되면 영영 안 울린다.
        # `or vector(0)`: 재시작 직후 카운터가 아직 없을 때도(= 한 건도 처리 못 함) 0으로 보게.
        expr: |
          sum(opicnic_worker_queued) > 0
          and
          (sum(increase(opicnic_worker_items_total[5m])) or vector(0)) == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "워커가 멈춘 것으로 보임 (대기 중인데 5분간 처리 시도 없음)"
          description: "opicnic_worker_queued={{ $value }}인데 5분간 done/retry/failed 증가가 없음. 워커 프로세스·DB 연결 확인."

      - alert: SubmitLatencySloBreach
        # 비동기 채점의 약속은 "제출은 빠르다" — 제출 응답(POST /api/scoring-jobs) p95 < 0.5초.
        # 0.5초가 정확히 SLO 버킷 경계(application.yml http.server.requests slo)라서 histogram_quantile 보간 대신
        # 버킷 비율을 직접 쓴다 — le="0.5" 버킷 안에 안 든 비율(1 - le=0.5/전체)이 곧 0.5초 초과 비율.
        # 10분 창에서 5% 초과, 창 안 요청이 5건 미만이면 표본이 적어 무시.
        # 이건 증상(지연) 지표다 — 원인(DB, R2 presign 등) 지표엔 걸지 않는다는 파일 상단 원칙과 동일.
        # 비율을 `and`의 왼쪽에 둔다 — `and`는 왼쪽 값을 돌려주므로, 반대로 두면 $value가 요청 건수가 된다.
        expr: |
          (
            1 -
            sum(increase(http_server_requests_seconds_bucket{uri="/api/scoring-jobs", method="POST", le="0.5"}[10m]))
            /
            sum(increase(http_server_requests_seconds_bucket{uri="/api/scoring-jobs", method="POST", le="+Inf"}[10m]))
          ) > 0.05
          and
          sum(increase(http_server_requests_seconds_count{uri="/api/scoring-jobs", method="POST"}[10m])) >= 5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "제출 응답 지연 SLO 위반 (10분 창, 5분 지속)"
          description: "POST /api/scoring-jobs 응답 중 {{ $value | humanizePercentage }}이 0.5초를 초과함(SLO: p95 < 0.5초). 제출이 느려지면 사용자는 '약속'이 깨졌다고 느낀다."

      - alert: JobCompletionSloBreach
        # 60초는 현재 모의고사 완료 SLO(docs/performance/slo.md) — 그 문서 값이 바뀌면 이 임계값(le="60")도 같이 바꿀 것.
        # opicnic_job_duration_seconds는 접수→완료 시점에 문항 단위가 아니라 잡 단위로 1회만 기록되므로(application.yml 주석 참고)
        # SubmitLatencySloBreach와 마찬가지로 버킷 비율로 SLO 안/밖을 직접 읽는다(60s가 정확한 버킷 경계).
        # 30분 창에서 10% 초과, 창 안 완료 잡이 3건 미만이면 표본이 적어 무시.
        # 비율을 `and`의 왼쪽에 둔다 — `and`는 왼쪽 값을 돌려주므로, 반대로 두면 $value가 잡 건수가 된다.
        expr: |
          (
            1 -
            sum(increase(opicnic_job_duration_seconds_bucket{le="60"}[30m]))
            /
            sum(increase(opicnic_job_duration_seconds_bucket{le="+Inf"}[30m]))
          ) > 0.10
          and
          sum(increase(opicnic_job_duration_seconds_count[30m])) >= 3
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "채점 잡 완료 SLO 위반 (30분 창, 10분 지속)"
          description: "완료된 채점 잡 중 {{ $value | humanizePercentage }}이 60초를 초과함(모의고사 완료 SLO, docs/performance/slo.md 기준). 임계값은 그 문서가 바뀌면 같이 바꿀 것."

      # 서킷 상시 OPEN(circuit_open==1)은 넣지 않는다: circuit.record()는 시도마다(재시도 포함) 기록되므로
      # 서킷이 열리는 실패 폭주는 위 WorkerItemFinalFailureRatioHigh보다 먼저 반응하지만, 서킷은 30초마다
      # 반열림 재시도로 닫혔다 열렸다를 반복해 "sustained" 5분 조건이 오탐(잦은 open/close 사이 gap)에 취약하다.
      # 최종 사용자 증상(문항 FAILED)은 위 규칙이 이미 잡으므로 중복 신호로 보고 제외.
