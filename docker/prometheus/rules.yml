# 알림은 결과 지표(채점 실패율) 하나만. CPU·힙 같은 원인 지표엔 걸지 않는다 — 2026-07-31·08-31 모델 소멸
# 장애 때 그 지표들은 전부 정상이었다. 실제 장애를 잡을 수 있는 건 외부 호출 outcome뿐이다.
groups:
  - name: opicnic-scoring
    rules:
      - alert: ScoringFailureRateHigh
        # 5분 창에서 채점(kind=score) 호출이 3건 이상이고, 그 중 outcome!=ok가 50% 이상.
        # 3건 미만은 표본이 적어 무시(사용자 1명의 429 한 번으로 울리지 않게).
        expr: |
          sum(increase(opicnic_external_call_seconds_count{provider="groq", kind="score"}[5m])) >= 3
          and
          (
            sum(increase(opicnic_external_call_seconds_count{provider="groq", kind="score", outcome!="ok"}[5m]))
            /
            sum(increase(opicnic_external_call_seconds_count{provider="groq", kind="score"}[5m]))
          ) >= 0.5
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "채점 실패율 50% 이상 (5분 창, 2분 지속)"
          description: "Groq 채점 호출 실패율이 {{ $value | humanizePercentage }}. 먼저 GET https://api.groq.com/openai/v1/models 로 모델 생존 확인 (PROJECT.md 참고)."
