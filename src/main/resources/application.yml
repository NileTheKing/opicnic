spring:
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true
  application:
    name: opicnic
  http:
    client:
      connect-timeout: 5s # Groq(STT/LLM) 등 외부 API 공통 연결 타임아웃
      read-timeout: 60s # 응답 대기 상한 — 무한 대기로 스레드가 걸려있는 것을 방지

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false

  datasource:
    url: jdbc:mysql://localhost:3306/opicnic
    username: ${DB_USERNAME}
    # .env의 DB_PASSWORD를 셸에 로드하고 실행할 것: set -a && source .env && set +a && ./gradlew bootRun
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 50 # DB 병목 가설 검증 중 10에서 50으로 확장했으나, 최종 병목은 파일 I/O로 판단
      connection-timeout: 30000 # 30 seconds
      idle-timeout: 600000 # 10 minutes
      max-lifetime: 1800000 # 30 minutes

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  ai:
    retry:
      max-attempts: 1
    stt:
      api-key: ${GROQ_API_KEY}
      enabled: ${STT_ENABLED:true}
    tagging:
      # 태깅 전용 모델. 채점 모델(아래 chat.options.model)과 일부러 분리 — Groq 한도는 모델별로 따로 적용돼서
      # 나눠 쓰면 TPD를 두 배로 쓸 수 있다.
      model: openai/gpt-oss-20b
    openai:
      api-key: ${GROQ_API_KEY}
      base-url: https://api.groq.com/openai
      enabled: ${LLM_ENABLED:true}
      chat:
        options:
          # Groq이 모델을 내리는 일이 반복됨(2026-07-31 llama-4-scout, 2026-08-31 llama-3.3-70b + llama-3.1-8b) — 죽으면 여기부터 확인
          model: openai/gpt-oss-120b
          stream-usage: false
  mvc:
    async:
      request-timeout: 120000 # 비동기 타임아웃 120초
  servlet:
    multipart:
      enabled: true # 다시 활성화
      file-size-threshold: 2MB # 2MB 이하는 디스크에 쓰지 않고 메모리에서 처리 (핵심 최적화)
      max-file-size: 4MB # 2분 녹음 webm/opus 실측 최대 1.3MB의 약 3배 여유
      max-request-size: 64MB # 모의고사 15문항을 한 요청에 담는 구조 (15 x 4MB + 여유)

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: 6c7274effddb5ca04eefc044be19bdec
            client-name: Kakao
            authorization-grant-type: authorization_code
            redirect-uri: http://localhost:8080/login/oauth2/code/kakao
            scope: profile_nickname,profile_image
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

async:
  thread:
    pool-size: 10

management:
  endpoints:
    web:
      exposure:
        include: prometheus, health, info
opicnic:
  coaching:
    min-count: 3

logging:
  level:
    com.zaxxer.hikari: INFO
    org.hibernate.SQL: INFO
