spring:
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true
  application:
    name: opicnic
  http:
    client:
      connect-timeout: 5s # Groq(STT/LLM) 등 외부 API 공통 연결 타임아웃
      read-timeout: 60s # 응답 대기 상한 — 무한 대기로 스레드가 걸려있는 것을 방지

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false

  datasource:
    url: jdbc:mysql://localhost:3306/opicnic
    username: ${DB_USERNAME}
    # .env의 DB_PASSWORD를 셸에 로드하고 실행할 것: set -a && source .env && set +a && ./gradlew bootRun
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 50 # DB 병목 가설 검증 중 10에서 50으로 확장했으나, 최종 병목은 파일 I/O로 판단
      connection-timeout: 30000 # 30 seconds
      idle-timeout: 600000 # 10 minutes
      max-lifetime: 1800000 # 30 minutes

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  ai:
    retry:
      max-attempts: 1
    stt:
      api-key: ${GROQ_API_KEY}
      enabled: ${STT_ENABLED:true}
    tagging:
      # 태깅 전용 모델. 채점 모델(아래 chat.options.model)과 일부러 분리 — Groq 한도는 모델별로 따로 적용돼서
      # 나눠 쓰면 TPD를 두 배로 쓸 수 있다.
      model: openai/gpt-oss-20b
    openai:
      api-key: ${GROQ_API_KEY}
      base-url: https://api.groq.com/openai
      enabled: ${LLM_ENABLED:true}
      chat:
        options:
          # Groq이 모델을 내리는 일이 반복됨(2026-07-31 llama-4-scout, 2026-08-31 llama-3.3-70b + llama-3.1-8b) — 죽으면 여기부터 확인
          model: openai/gpt-oss-120b
          stream-usage: false
  mvc:
    async:
      request-timeout: 120000 # 비동기 타임아웃 120초

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: 6c7274effddb5ca04eefc044be19bdec
            client-name: Kakao
            authorization-grant-type: authorization_code
            redirect-uri: http://localhost:8080/login/oauth2/code/kakao
            scope: profile_nickname,profile_image
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

async:
  thread:
    pool-size: 10

management:
  endpoints:
    web:
      exposure:
        include: prometheus, health, info
  metrics:
    distribution:
      percentiles-histogram:
        # count/sum만으로는 p95가 안 나온다. SLO 버킷을 함께 지정해 카디널리티를 제한한다.
        http.server.requests: true
      slo:
        http.server.requests: 100ms,500ms,1s,5s
opicnic:
  coaching:
    min-count: 3
  # 비동기 채점 워커 (ADR-0001, service/job/ScoringWorker). 값은 코드 기본값과 같다 — 운영에서 환경변수로 덮는다.
  worker:
    enabled: ${WORKER_ENABLED:true}
    # 동시에 외부(Groq)로 나가는 문항 수 상한. 우리 서버 능력이 아니라 "제공자 한도 ÷ 문항당 사용량"으로 정한다.
    # 무료 티어(TPM 8K)면 사실상 1, 종량제면 수백. 30은 동시 30명 × 1문항 가정의 시작값 — 측정으로 조정.
    concurrency: ${WORKER_CONCURRENCY:30}
    poll-ms: 1000
    # 최근 window건 중 실패가 failure-ratio 이상이면 open-seconds 동안 집지 않는다 (모델 소멸·제공자 장애 시 할당량 보호)
    circuit:
      window: 20
      failure-ratio: 0.8
      open-seconds: 30

logging:
  # 콘솔/파일 기본 패턴의 ${LOG_CORRELATION_PATTERN} 자리에 들어간다 — AttemptIdMdcFilter가 넣는 attemptId.
  pattern:
    correlation: "[attempt=%X{attemptId:-}] "
  level:
    com.zaxxer.hikari: INFO
    org.hibernate.SQL: INFO
