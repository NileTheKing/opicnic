<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>새 질문 세트 추가</title>
    <!-- 필요한 CSS 등 공통 헤더 여기에 포함 -->
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<div class="container">
    <h1>새 질문 세트 추가</h1>
    <p>새로운 질문 세트의 기본 정보를 입력합니다. 콤보와 질문은 세트 생성 후 추가할 수 있습니다.</p>

    <!-- 저장은 /api/admin/question-sets REST API로 fetch() 처리. 이 form은 값 입력 UI로만 사용. -->
    <form id="questionSetForm" onsubmit="return submitQuestionSetForm(event)" th:attr="data-id=${questionSet.id}">
        <div class="mb-3">
            <label for="name" class="form-label">세트 이름</label>
            <input type="text" id="name" name="name" class="form-control" th:value="${questionSet.name}" required>
        </div>

        <div class="mb-3">
            <label for="topic" class="form-label">주제</label>
            <select id="topic" name="topic" class="form-select" required>
                <option value="">-- 주제 선택 --</option>
                <option th:each="topicOpt : ${topics}"
                        th:value="${topicOpt}"
                        th:text="${topicOpt.label}"
                        th:selected="${topicOpt == questionSet.topic}"></option>
            </select>
        </div>

        <!-- 향후 이곳에 콤보와 질문을 동적으로 추가하는 UI가 들어감 -->

        <button type="submit" class="btn btn-primary">저장</button>
        <a href="/admin/question-sets" th:href="@{/admin/question-sets}" class="btn btn-secondary">취소</a>
    </form>
</div>

<script>
    function submitQuestionSetForm(event) {
        event.preventDefault();
        const form = document.getElementById('questionSetForm');
        const id = form.getAttribute('data-id');
        const body = JSON.stringify({
            name: document.getElementById('name').value,
            topic: document.getElementById('topic').value
        });
        const url = id ? '/api/admin/question-sets/' + id : '/api/admin/question-sets';
        fetch(url, {
            method: id ? 'PUT' : 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: body
        })
            .then(res => {
                if (!res.ok) throw new Error('저장 실패: ' + res.status);
                location.href = '/admin/question-sets';
            })
            .catch(err => alert(err.message));
        return false;
    }
</script>

</body>
</html>
