<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>질문 세트 관리</title>
    <!-- 필요한 CSS 등 공통 헤더 여기에 포함 -->
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<div class="container">
    <h1>질문 세트 관리</h1>
    <p>데이터베이스에 저장된 모든 질문 세트 목록입니다.</p>

    <div class="mb-3">
        <a href="/admin/question-sets/new" th:href="@{/admin/question-sets/new}" class="btn btn-primary">새 질문 세트 추가</a>
    </div>

    <table class="table">
        <thead>
        <tr>
            <th>ID</th>
            <th>이름</th>
            <th>주제</th>
            <th>난이도</th>
            <th>콤보 수</th>
            <th>작업</th>
        </tr>
        </thead>
        <tbody>
        <!-- th:each를 사용하여 questionSets 목록을 반복 -->
        <tr th:each="set : ${questionSets}">
            <td th:text="${set.id}">1</td>
            <td th:text="${set.name}">Unexpected Topic: Recycling - Level 3</td>
            <td th:text="${set.topic.label}">재활용</td>
            <td th:text="${set.difficulty.name()}">LEVEL_3</td>
            <td th:text="${#lists.size(set.combos)}">5</td>
            <td>
                <a th:href="@{/admin/question-sets/{id}/edit(id=${set.id})}" class="btn btn-secondary btn-sm">수정</a>
                <button type="button" class="btn btn-danger btn-sm" th:attr="data-id=${set.id}" onclick="deleteQuestionSet(this)">삭제</button>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<script>
    function deleteQuestionSet(button) {
        if (!confirm('정말로 이 질문 세트를 보관하시겠습니까?')) return;
        const id = button.getAttribute('data-id');
        fetch('/api/admin/question-sets/' + id, { method: 'DELETE' })
            .then(res => {
                if (!res.ok) throw new Error('삭제 실패: ' + res.status);
                location.reload();
            })
            .catch(err => alert(err.message));
    }
</script>

</body>
</html>
