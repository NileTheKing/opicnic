<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Opicnic</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen font-sans flex">
<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="flex-1 flex flex-col">

    <main class="flex-1 p-4 sm:p-6 max-w-3xl lg:max-w-5xl mx-auto w-full pb-20 md:pb-6">

        <!-- 비로그인 상태 -->
        <div sec:authorize="!isAuthenticated()" class="text-center py-20">
            <h1 class="text-3xl font-bold text-gray-800 mb-3">OPIc 실전 연습</h1>
            <p class="text-gray-500 mb-8">AI 피드백으로 OPIc 목표 등급을 달성하세요</p>
            <a href="/auth/login"
               class="inline-block bg-brand-600 text-white px-8 py-3 rounded-xl font-semibold hover:bg-brand-700 transition">
                카카오로 시작하기
            </a>
        </div>

        <!-- 로그인 상태 -->
        <div sec:authorize="isAuthenticated()">

            <!-- 주제 미설정 경고 -->
            <div th:if="${selectedTopics == null or #lists.isEmpty(selectedTopics)}"
                 class="mb-4 flex items-center gap-3 bg-amber-50 border border-amber-200 text-amber-700 text-sm px-4 py-3 rounded-xl">
                <i class="fas fa-triangle-exclamation"></i>
                <span>연습 주제가 설정되지 않았어요.
                    <a href="/mypage" class="underline font-medium">마이페이지</a>에서 주제를 선택해주세요.</span>
            </div>

            <!-- 히어로: 내 주제 랜덤 연습 -->
            <div class="bg-gradient-to-br from-brand-600 to-brand-500 rounded-2xl p-7 lg:p-10 text-white mb-4 shadow-lg">
                <div class="flex items-start justify-between mb-5 lg:mb-8">
                    <div>
                        <p class="text-brand-200 text-sm lg:text-base mb-1">오늘의 연습</p>
                        <h2 class="text-2xl lg:text-4xl font-bold">내 주제 랜덤 콤보</h2>
                        <p class="text-brand-200 text-sm lg:text-base mt-1 lg:mt-2">
                            <span th:if="${selectedTopics != null and not #lists.isEmpty(selectedTopics)}"
                                  th:text="${#lists.size(selectedTopics)} + '개 주제 중 랜덤 선택'"></span>
                            <span th:if="${selectedTopics == null or #lists.isEmpty(selectedTopics)}">주제를 먼저 설정해주세요</span>
                        </p>
                    </div>
                    <div class="w-12 h-12 lg:w-16 lg:h-16 rounded-2xl bg-white/20 flex items-center justify-center">
                        <i class="fa-solid fa-bullseye text-xl lg:text-2xl text-white"></i>
                    </div>
                </div>

                <div class="flex gap-3 lg:max-w-md">
                    <a href="/practice/random"
                       th:classappend="${selectedTopics == null or #lists.isEmpty(selectedTopics)} ? 'opacity-50 pointer-events-none' : ''"
                       class="flex-1 bg-white text-brand-700 font-semibold py-3 lg:py-3.5 rounded-xl text-center hover:bg-gray-50 transition">
                        바로 시작하기
                    </a>
                    <a href="/practice/surprise"
                       class="flex items-center gap-2 bg-white/20 hover:bg-white/30 text-white font-medium px-5 py-3 lg:py-3.5 rounded-xl transition">
                        <i class="fa-solid fa-bolt"></i> 돌발로 하기
                    </a>
                </div>
            </div>

            <!-- 카드 4개: 모의고사 / 집중 연습 / 오늘 할 일 / AI 코칭 -->
            <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">

                <!-- 모의고사 -->
                <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
                    <div class="flex items-center justify-between mb-3">
                        <div class="w-10 h-10 rounded-xl bg-gray-100 flex items-center justify-center">
                            <i class="fa-solid fa-file-lines text-gray-400"></i>
                        </div>
                        <span class="text-xs bg-gray-50 text-brand-600 px-2 py-0.5 rounded-full">15문항</span>
                    </div>
                    <h3 class="font-bold text-gray-800 mb-1">모의고사</h3>
                    <p class="text-sm text-gray-400 mb-4">실전처럼 15문제 풀기</p>
                    <a href="/practice/mock"
                       th:classappend="${selectedTopics == null or #lists.isEmpty(selectedTopics)} ? 'opacity-50 pointer-events-none' : ''"
                       class="block w-full py-2.5 bg-gray-900 text-white rounded-xl text-sm font-medium text-center hover:bg-gray-800 transition">
                        시작하기
                    </a>
                </div>

                <!-- 집중 연습 -->
                <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
                    <div class="flex items-center justify-between mb-3">
                        <div class="w-10 h-10 rounded-xl bg-gray-50 flex items-center justify-center">
                            <i class="fa-solid fa-crosshairs text-gray-500"></i>
                        </div>
                        <span class="text-xs bg-gray-50 text-gray-500 px-2 py-0.5 rounded-full">주제·콤보·유형</span>
                    </div>
                    <h3 class="font-bold text-gray-800 mb-1">집중 연습</h3>
                    <p class="text-sm text-gray-400 mb-4">원하는 방식으로 골라서 연습</p>
                    <a href="/practice/focus"
                       class="block w-full py-2.5 bg-gray-50 text-brand-600 rounded-xl text-sm font-medium text-center hover:bg-gray-100 transition">
                        선택하기
                    </a>
                </div>

                <!-- 오늘 할 일 (B) — 시험 일정 없으면 등록 유도 상태로 표시, 카드 자체는 항상 노출 -->
                <a th:if="${hasSchedule}" href="/today"
                   class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 hover:border-gray-200 transition-colors block">
                    <div class="flex items-center justify-between mb-2">
                        <div class="w-9 h-9 rounded-xl bg-gray-100 flex items-center justify-center">
                            <i class="fa-solid fa-list-check text-gray-500 text-sm"></i>
                        </div>
                        <span class="text-xs font-bold text-brand-600" th:text="'D-' + ${daysLeft}"></span>
                    </div>
                    <p class="text-sm font-bold text-gray-800">오늘 할 일</p>
                    <p class="text-xs text-gray-400 mt-0.5">
                        콤보 <span th:text="${todayComboDone}"></span>/<span th:text="${todayComboTarget}"></span>개 완료
                    </p>
                </a>
                <a th:unless="${hasSchedule}" href="/exam"
                   class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 hover:border-gray-200 transition-colors block">
                    <div class="flex items-center justify-between mb-2">
                        <div class="w-9 h-9 rounded-xl bg-gray-100 flex items-center justify-center">
                            <i class="fa-solid fa-list-check text-gray-500 text-sm"></i>
                        </div>
                    </div>
                    <p class="text-sm font-bold text-gray-800">오늘 할 일</p>
                    <p class="text-xs text-gray-400 mt-0.5">시험 일정을 등록하면 표시돼요</p>
                </a>

                <!-- AI 코칭 -->
                <a th:if="${coachingTeaser != null}" href="/analytics/coaching"
                   class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 hover:border-gray-200 transition-colors block">
                    <div class="flex items-center justify-between mb-2">
                        <div class="w-9 h-9 rounded-xl bg-gray-100 flex items-center justify-center">
                            <i class="fa-solid fa-robot text-gray-500 text-sm"></i>
                        </div>
                    </div>
                    <p class="text-sm font-bold text-gray-800">AI 코칭</p>
                    <p class="text-xs text-gray-400 mt-0.5" th:text="${coachingTeaser.message()}"></p>
                </a>

                <!-- 최근 기록 -->
                <a th:if="${hasHistory}" href="/analytics/history"
                   class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 hover:border-gray-200 transition-colors block">
                    <div class="flex items-center justify-between mb-2">
                        <div class="w-9 h-9 rounded-xl bg-gray-100 flex items-center justify-center">
                            <i class="fa-solid fa-clock-rotate-left text-gray-500 text-sm"></i>
                        </div>
                    </div>
                    <p class="text-sm font-bold text-gray-800">최근 기록</p>
                    <p class="text-xs text-gray-400 mt-0.5">지난 연습 다시보기</p>
                </a>

            </div>

        </div>
    </main>
</div>

</body>
</html>
