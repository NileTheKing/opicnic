<div th:fragment="card(parsed, report, gradeLabels, currentGradeLabel, targetGradeLabel, avgScore, targetThreshold)"
     xmlns:th="http://www.thymeleaf.org" class="space-y-3 mb-4">

    <!-- 메타 -->
    <div class="flex items-center justify-between text-xs text-gray-400 px-1">
        <div class="flex items-center gap-1">
            <i class="fa-solid fa-robot text-gray-400"></i>
            <span>AI 분석 결과</span>
        </div>
        <span th:text="${#temporals.format(report.createdAt, 'M월 d일 HH:mm')} + ' · ' + ${report.basedOnCount} + '문항 기준'"></span>
    </div>

    <!-- 요약 -->
    <div class="bg-gray-50 rounded-2xl p-4 space-y-2" th:if="${parsed['summary'] != null}">
        <p class="text-sm font-medium text-gray-800" th:text="${parsed['summary']}"></p>
        <div th:if="${parsed['strength'] != null}" class="flex items-start gap-2 pt-1">
            <i class="fa-solid fa-circle-check text-brand-500 text-xs mt-0.5 shrink-0"></i>
            <p class="text-sm text-brand-700" th:text="${parsed['strength']}"></p>
        </div>
    </div>

    <!-- OPIc 등급 사다리 -->
    <div class="bg-white rounded-2xl p-4 shadow-sm space-y-3">
        <div class="flex justify-between relative pt-8">
            <div class="absolute left-1 right-1 top-[42px] h-px bg-gray-100"></div>
            <div th:each="grade : ${gradeLabels}" class="relative flex flex-col items-center gap-1.5 flex-1">
                <span th:if="${grade == targetGradeLabel}" class="absolute -top-6 text-[9px] font-bold text-amber-600 whitespace-nowrap">목표</span>
                <span th:if="${grade == currentGradeLabel}" class="w-4 h-4 rounded-full bg-brand-600 ring-4 ring-brand-50"></span>
                <span th:if="${grade == targetGradeLabel and grade != currentGradeLabel}" class="w-3 h-3 rounded-full bg-white border-2 border-amber-500"></span>
                <span th:if="${grade != currentGradeLabel and grade != targetGradeLabel}" class="w-2.5 h-2.5 rounded-full bg-gray-200"></span>
                <span class="text-[10px] font-semibold"
                      th:classappend="${grade == currentGradeLabel} ? 'text-brand-600' : (${grade == targetGradeLabel} ? 'text-amber-600' : 'text-gray-400')"
                      th:text="${grade}"></span>
            </div>
        </div>
        <p class="text-xs text-gray-400 text-center border-t border-gray-100 pt-2.5">
            평균 <span class="font-semibold text-gray-600" th:text="${avgScore}"></span>점 → 현재
            <span class="font-semibold text-brand-600" th:text="${currentGradeLabel}"></span> 구간 ·
            <span class="font-semibold text-amber-600" th:text="${targetGradeLabel}"></span> 도달엔 평균
            <span class="font-semibold text-gray-600" th:text="${targetThreshold}"></span>+ 필요
        </p>
    </div>

    <!-- 요소별: 더 신경 써야 할 부분 (약점 있는 것만, 큰 카드) -->
    <div th:if="${parsed['weakCriteria'] != null and !#lists.isEmpty(parsed['weakCriteria'])}">
        <h2 class="text-xs font-semibold text-gray-500 mb-2 px-1">더 신경 써야 할 부분</h2>
        <div class="space-y-3">
            <div th:each="item : ${parsed['weakCriteria']}" class="bg-white rounded-2xl p-4 shadow-sm space-y-2.5">
                <div class="flex items-center justify-between">
                    <span class="text-sm font-bold text-gray-900" th:text="${item['name']}"></span>
                    <span class="text-xs font-bold text-brand-600 bg-brand-50 rounded-full px-2.5 py-1 tabular-nums"
                          th:text="${item['score']} + ' / 5'"></span>
                </div>
                <p class="text-xs text-gray-400 leading-relaxed" th:text="${item['analysis']}"></p>
                <p th:if="${item['advice'] != null}" class="text-sm text-gray-700 leading-relaxed" th:text="${item['advice']}"></p>
                <div th:if="${item['examples'] != null and !#lists.isEmpty(item['examples'])}">
                    <button th:onclick="|this.nextElementSibling.classList.toggle('hidden');this.querySelector('i').classList.toggle('rotate-180')|"
                            class="flex items-center gap-1 text-xs font-semibold text-brand-600">
                        <span th:text="'예시 ' + ${#lists.size(item['examples'])} + '개 보기'"></span>
                        <i class="fa-solid fa-chevron-down text-[9px] transition-transform"></i>
                    </button>
                    <div class="hidden space-y-2 mt-2">
                        <div th:each="ex : ${item['examples']}" class="bg-gray-50 rounded-xl px-3 py-2.5 text-sm leading-relaxed">
                            <span class="text-rose-700 font-mono text-[13px]" th:text="'&quot;' + ${ex['before']} + '&quot;'"></span><br>
                            <span class="text-gray-400">→</span>
                            <span class="text-emerald-700 font-mono text-[13px]" th:text="'&quot;' + ${ex['after']} + '&quot;'"></span>
                            <p class="text-xs text-gray-400 mt-1.5 pl-3 border-l border-gray-200" th:text="${ex['why']}"></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 요소별 코칭 (구 스키마 fallback: weakCriteria 없고 criteria만 있는 옛날 리포트) -->
    <div th:if="${parsed['weakCriteria'] == null and parsed['criteria'] != null and !#lists.isEmpty(parsed['criteria'])}"
         class="bg-white rounded-2xl p-4 shadow-sm">
        <h2 class="text-xs font-semibold text-gray-500 mb-3">요소별 분석</h2>
        <div class="space-y-4">
            <div th:each="item : ${parsed['criteria']}" class="space-y-1.5">
                <span class="shrink-0 whitespace-nowrap text-xs font-semibold text-brand-600 bg-brand-50 rounded-full px-2.5 py-0.5"
                      th:text="${item['name']}"></span>
                <p th:if="${item['analysis'] != null}" class="text-xs text-gray-400 leading-relaxed pl-1" th:text="${item['analysis']}"></p>
                <p class="text-sm text-gray-700 leading-relaxed pl-1" th:text="${item['advice']}"></p>
            </div>
        </div>
    </div>

    <!-- 요소별: 안정적인 부분 (컴팩트 카드) -->
    <div th:if="${parsed['stableCriteria'] != null and !#lists.isEmpty(parsed['stableCriteria'])}">
        <h2 class="text-xs font-semibold text-gray-500 mb-2 px-1">안정적인 부분</h2>
        <div class="grid grid-cols-2 gap-3">
            <div th:each="item : ${parsed['stableCriteria']}" class="bg-white rounded-2xl p-3.5 shadow-sm space-y-1.5">
                <div class="flex items-center justify-between">
                    <span class="text-xs font-bold text-gray-700" th:text="${item['name']}"></span>
                    <span class="text-xs font-bold text-emerald-700 bg-emerald-50 rounded-full px-2 py-0.5 tabular-nums"
                          th:text="${item['score']} + ' / 5'"></span>
                </div>
                <p class="text-xs text-gray-400 leading-relaxed" th:text="${item['note']}"></p>
            </div>
        </div>
    </div>

    <!-- 유형별 코칭: 개수를 약속하지 않음(실제로 반복 패턴이 확인된 유형만큼만 나옴). 부족하면 이유를 설명 -->
    <div th:if="${parsed['summary'] != null}" class="bg-white rounded-2xl p-4 shadow-sm">
        <h2 class="text-xs font-semibold text-gray-500 mb-3">유형별 약점</h2>
        <div th:if="${parsed['types'] != null and !#lists.isEmpty(parsed['types'])}" class="space-y-4">
            <div th:each="item : ${parsed['types']}" class="space-y-1.5">
                <span class="text-xs font-semibold text-rose-800 bg-rose-50 rounded-full px-2.5 py-0.5" th:text="${item['label']}"></span>
                <p th:if="${item['pattern'] != null}" class="text-xs text-gray-400 leading-relaxed pl-1" th:text="${item['pattern']}"></p>
                <p class="text-sm text-gray-700 leading-relaxed pl-1" th:text="${item['strategy'] != null} ? ${item['strategy']} : ${item['advice']}"></p>
            </div>
        </div>
        <p th:if="${parsed['types'] == null or #lists.size(parsed['types']) < 2}"
           class="text-xs text-gray-400 leading-relaxed mt-3"
           th:text="${parsed['types'] == null or #lists.isEmpty(parsed['types'])}
                     ? '아직 유형별로 반복되는 패턴을 판단하기엔 연습이 부족해요. 같은 유형을 몇 번 더 연습하면 분석해드릴게요.'
                     : '다른 유형은 아직 반복 패턴을 판단하기엔 연습이 부족해요. 더 연습하면 추가로 분석해드릴게요.'"></p>
    </div>

    <!-- 이번 주 과제: 신 스키마(practice/habit 객체) -->
    <div th:if="${parsed['this_week'] != null and parsed['this_week'] instanceof T(java.util.Map)}"
         class="bg-brand-600 rounded-2xl p-4 space-y-3">
        <h2 class="text-xs font-semibold text-brand-200">이번 주 집중 과제</h2>
        <div class="space-y-1">
            <span class="text-[10px] font-bold tracking-wide text-brand-300">PRACTICE</span>
            <p class="text-sm font-medium text-white leading-relaxed" th:text="${parsed['this_week']['practice']}"></p>
        </div>
        <div class="space-y-1">
            <span class="text-[10px] font-bold tracking-wide text-brand-300">HABIT</span>
            <p class="text-sm font-medium text-white leading-relaxed" th:text="${parsed['this_week']['habit']}"></p>
        </div>
    </div>

    <!-- 이번 주 과제: 구 스키마(문자열) -->
    <div th:if="${parsed['this_week'] != null and !(parsed['this_week'] instanceof T(java.util.Map))}"
         class="bg-brand-600 rounded-2xl p-4">
        <h2 class="text-xs font-semibold text-brand-200 mb-1.5">이번 주 집중 과제</h2>
        <p class="text-sm font-medium text-white leading-relaxed" th:text="${parsed['this_week']}"></p>
    </div>

    <!-- JSON 파싱 실패 fallback -->
    <div th:if="${parsed['criteria'] == null and parsed['summary'] == null}" class="bg-white rounded-2xl p-5 shadow-sm">
        <p class="text-sm text-gray-700 leading-relaxed whitespace-pre-line" th:text="${report.content}"></p>
    </div>

</div>
