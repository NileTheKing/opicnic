<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기록 - Opicnic</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body class="bg-gray-50 min-h-screen">

<div class="flex min-h-screen">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="flex-1 p-5 md:p-8 pb-24 md:pb-8 min-w-0 max-w-2xl mx-auto w-full">

        <div class="flex items-center gap-3 mb-6">
            <a href="/analytics" class="text-gray-400 hover:text-gray-600 transition-colors">
                <i class="fa-solid fa-chevron-left text-sm"></i>
            </a>
            <h1 class="text-xl font-bold text-gray-900">최근 기록</h1>
        </div>

        <div th:if="${results.isEmpty()}" class="bg-white rounded-2xl p-10 text-center shadow-sm">
            <p class="text-sm text-gray-400">아직 연습 기록이 없어요</p>
        </div>

        <div th:unless="${results.isEmpty()}" class="flex flex-col gap-2">
            <a th:each="r : ${results}"
               th:href="@{/analytics/history/{id}(id=${r.id})}"
               class="flex items-center justify-between bg-white rounded-2xl px-5 py-4 shadow-sm border border-gray-100 hover:border-gray-200 transition-colors">
                <div class="min-w-0">
                    <div class="flex items-center gap-2 mb-1">
                        <span th:if="${r.overallGrade != null}" th:text="${r.overallGrade}"
                              class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-gray-100 text-gray-600 shrink-0"></span>
                        <span class="text-sm font-semibold text-gray-800 truncate"
                              th:text="${r.surveyTopicName != null ? r.surveyTopicName : typeLabels.typeLabel(r.questionType)}"></span>
                    </div>
                    <p class="text-xs text-gray-400">
                        <span th:text="${typeLabels.typeLabel(r.questionType)}"></span>
                        <span th:text="' · ' + ${#temporals.format(r.createdAt, 'M월 d일 HH:mm')}"></span>
                    </p>
                </div>
                <i class="fa-solid fa-chevron-right text-gray-300 text-xs shrink-0"></i>
            </a>
        </div>

    </main>
</div>

</body>
</html>
