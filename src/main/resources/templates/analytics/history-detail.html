<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기록 상세 - OPIcnic</title>
    <script src="https://cdn.tailwindcss.com"></script>
<script>
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    brand: {
                        50:  '#f0f5fb',
                        100: '#d8e6f3',
                        200: '#b0cce7',
                        300: '#7dacd5',
                        400: '#528db8',
                        500: '#3a729f',
                        600: '#2e5c86',
                        700: '#234870',
                        800: '#17325a',
                        900: '#0e2040',
                    }
                }
            }
        }
    }
</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body class="bg-gray-50 min-h-screen">

<div class="max-w-xl mx-auto px-4 py-6 pb-16">

    <!-- 탑바 -->
    <div class="flex items-center justify-between mb-6">
        <a href="/analytics/history" class="flex items-center gap-2 text-sm text-gray-500 hover:text-gray-700 transition-colors">
            <i class="fa-solid fa-chevron-left text-xs"></i>
            <span>기록</span>
        </a>
        <span class="text-sm font-semibold text-gray-900" th:text="${typeLabels.typeLabel(result.questionType)}"></span>
        <div class="w-10"></div>
    </div>

    <div class="bg-white rounded-2xl overflow-hidden shadow-sm">

        <!-- 헤더: 등급 + 날짜 -->
        <div class="px-5 pt-5 pb-4">
            <div class="flex items-center justify-between mb-4">
                <span class="text-xs text-gray-400" th:text="${#temporals.format(result.createdAt, 'yyyy.M.d HH:mm')}"></span>
                <span th:if="${result.overallGrade != null}"
                      th:text="${result.overallGrade}"
                      th:classappend="${result.overallGrade == 'AL'} ? 'bg-purple-100 text-purple-700' :
                                      (${result.overallGrade == 'IH'} ? 'bg-blue-100 text-blue-700' :
                                      (${result.overallGrade.startsWith('IM')} ? 'bg-gray-100 text-brand-700' :
                                      'bg-gray-100 text-gray-500'))"
                      class="text-xs font-bold px-3 py-1 rounded-full"></span>
            </div>
            <p th:if="${result.overall != null}" class="text-xs text-gray-400 mt-1 text-right" th:text="${result.overall}"></p>

            <!-- 5개 점수 바 -->
            <div class="space-y-2">
                <div th:if="${result.mainPointScore != null}" class="flex items-center gap-3">
                    <span class="text-xs text-gray-400 w-14 shrink-0">핵심전달</span>
                    <div class="flex-1 bg-gray-100 rounded-full h-1.5">
                        <div class="h-1.5 rounded-full bg-gray-500" th:style="'width: ' + ${result.mainPointScore * 20} + '%'"></div>
                    </div>
                    <span class="text-xs font-semibold text-gray-600 w-4 text-right shrink-0" th:text="${result.mainPointScore}"></span>
                </div>
                <div th:if="${result.expressionScore != null}" class="flex items-center gap-3">
                    <span class="text-xs text-gray-400 w-14 shrink-0">표현력</span>
                    <div class="flex-1 bg-gray-100 rounded-full h-1.5">
                        <div class="h-1.5 rounded-full bg-gray-500" th:style="'width: ' + ${result.expressionScore * 20} + '%'"></div>
                    </div>
                    <span class="text-xs font-semibold text-gray-600 w-4 text-right shrink-0" th:text="${result.expressionScore}"></span>
                </div>
                <div th:if="${result.accuracyScore != null}" class="flex items-center gap-3">
                    <span class="text-xs text-gray-400 w-14 shrink-0">정확성</span>
                    <div class="flex-1 bg-gray-100 rounded-full h-1.5">
                        <div class="h-1.5 rounded-full bg-gray-500" th:style="'width: ' + ${result.accuracyScore * 20} + '%'"></div>
                    </div>
                    <span class="text-xs font-semibold text-gray-600 w-4 text-right shrink-0" th:text="${result.accuracyScore}"></span>
                </div>
                <div th:if="${result.fluencyScore != null}" class="flex items-center gap-3">
                    <span class="text-xs text-gray-400 w-14 shrink-0">발화량</span>
                    <div class="flex-1 bg-gray-100 rounded-full h-1.5">
                        <div class="h-1.5 rounded-full bg-gray-500" th:style="'width: ' + ${result.fluencyScore * 20} + '%'"></div>
                    </div>
                    <span class="text-xs font-semibold text-gray-600 w-4 text-right shrink-0" th:text="${result.fluencyScore}"></span>
                </div>
                <div th:if="${result.contentScore != null}" class="flex items-center gap-3">
                    <span class="text-xs text-gray-400 w-14 shrink-0">내용구성</span>
                    <div class="flex-1 bg-gray-100 rounded-full h-1.5">
                        <div class="h-1.5 rounded-full bg-gray-500" th:style="'width: ' + ${result.contentScore * 20} + '%'"></div>
                    </div>
                    <span class="text-xs font-semibold text-gray-600 w-4 text-right shrink-0" th:text="${result.contentScore}"></span>
                </div>
            </div>
        </div>

        <div class="border-t border-gray-100"></div>

        <!-- 질문 + 내 답변 -->
        <div class="px-5 py-4 space-y-4">
            <div th:if="${result.questionContent != null}">
                <p class="text-xs font-medium text-gray-400 mb-1">질문</p>
                <p class="text-sm text-gray-700 leading-relaxed" th:text="${result.questionContent}"></p>
            </div>
            <div th:if="${result.sttText != null and !result.sttText.isBlank()}">
                <p class="text-xs font-medium text-gray-400 mb-1">내 답변</p>
                <p class="text-sm text-gray-500 leading-relaxed italic" th:text="${result.sttText}"></p>
            </div>
        </div>

        <div class="border-t border-gray-100"></div>

        <!-- 세부 피드백 -->
        <div class="px-5 py-4 space-y-3">
            <div th:if="${result.mainPoint != null}">
                <p class="text-xs font-semibold text-gray-500 mb-0.5">핵심전달</p>
                <p class="text-sm text-gray-600 leading-relaxed" th:text="${result.mainPoint}"></p>
            </div>
            <div th:if="${result.expression != null}">
                <p class="text-xs font-semibold text-gray-500 mb-0.5">표현력</p>
                <p class="text-sm text-gray-600 leading-relaxed" th:text="${result.expression}"></p>
            </div>
            <div th:if="${result.accuracy != null}">
                <p class="text-xs font-semibold text-gray-500 mb-0.5">정확성</p>
                <p class="text-sm text-gray-600 leading-relaxed" th:text="${result.accuracy}"></p>
            </div>
            <div th:if="${result.fluency != null}">
                <p class="text-xs font-semibold text-gray-500 mb-0.5">발화량</p>
                <p class="text-sm text-gray-600 leading-relaxed" th:text="${result.fluency}"></p>
            </div>
            <div th:if="${result.content != null}">
                <p class="text-xs font-semibold text-gray-500 mb-0.5">내용구성</p>
                <p class="text-sm text-gray-600 leading-relaxed" th:text="${result.content}"></p>
            </div>
        </div>

        <!-- 개선점 -->
        <div th:if="${result.improvements != null}" class="px-5 py-4">
            <div class="flex gap-3 bg-amber-50 rounded-xl px-4 py-3">
                <i class="fa-solid fa-lightbulb text-amber-400 text-sm mt-0.5 shrink-0"></i>
                <div>
                    <p class="text-xs font-semibold text-amber-700 mb-1">이렇게 바꿔보세요</p>
                    <p class="text-sm text-amber-800 leading-relaxed" th:text="${result.improvements}"></p>
                </div>
            </div>
        </div>

        <!-- 모범 답변 -->
        <div th:if="${result.modelAnswer != null}" class="px-5 pb-5">
            <button onclick="this.nextElementSibling.classList.toggle('hidden'); this.querySelector('.chevron2').classList.toggle('rotate-180')"
                    class="w-full flex items-center justify-between bg-gray-50 hover:bg-gray-100 transition-colors rounded-xl px-4 py-3 text-left">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-wand-magic-sparkles text-gray-400 text-xs"></i>
                    <span class="text-xs font-semibold text-brand-700">모범 답변 보기</span>
                </div>
                <i class="chevron2 fa-solid fa-chevron-down text-xs text-gray-300 transition-transform duration-200"></i>
            </button>
            <div class="hidden mt-2 px-4 py-3 bg-gray-50 rounded-xl space-y-3">
                <p class="text-sm text-gray-700 leading-relaxed" th:text="${result.modelAnswer}"></p>
                <div th:if="${result.modelAnswerComment != null}" class="pt-2 border-t border-gray-200">
                    <p class="text-xs text-gray-500 leading-relaxed" th:text="${result.modelAnswerComment}"></p>
                </div>
            </div>
        </div>

    </div>

</div>
</body>
</html>
