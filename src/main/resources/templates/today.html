<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘 할 일 - OPIcnic</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body class="bg-gray-50 min-h-screen">

<div class="flex min-h-screen">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="flex-1 p-5 md:p-8 pb-24 md:pb-8 min-w-0">
        <div class="max-w-xl mx-auto">

            <div class="flex items-center gap-3 mb-6">
                <a href="/" class="text-gray-400 hover:text-gray-600 transition-colors">
                    <i class="fa-solid fa-chevron-left text-sm"></i>
                </a>
                <h1 class="text-xl font-bold text-gray-900">오늘 할 일</h1>
            </div>

            <!-- 일정 미등록 -->
            <div th:if="${!hasSchedule}" class="bg-white rounded-2xl p-8 text-center shadow-sm">
                <i class="fa-solid fa-calendar-check text-4xl text-gray-200 mb-4"></i>
                <p class="font-medium text-gray-500">시험 일정을 등록하면 오늘 할 일이 여기 표시돼요</p>
                <a href="/exam" class="inline-block mt-4 px-6 py-2.5 bg-brand-600 text-white text-sm font-semibold rounded-xl hover:bg-brand-700 transition-colors">
                    시험 일정 등록하기
                </a>
            </div>

            <div th:if="${hasSchedule}" class="space-y-4">

                <!-- 오늘 콤보 목표 + D-day -->
                <div class="bg-brand-600 rounded-2xl p-5 text-white">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-brand-200 text-xs font-medium mb-0.5">오늘 콤보 목표</p>
                            <p class="text-3xl font-black">
                                <span th:text="${todayComboDone}"></span>/<span th:text="${todayComboTarget}"></span>개 완료
                            </p>
                        </div>
                        <div class="text-right">
                            <p class="text-brand-200 text-xs mb-0.5">시험까지</p>
                            <p class="text-3xl font-black" th:text="'D-' + ${daysLeft}"></p>
                        </div>
                    </div>
                    <div class="mt-4 bg-white/20 rounded-full h-2">
                        <div class="bg-white rounded-full h-2 transition-all"
                             th:style="'width: ' + ${todayProgressPct} + '%'"></div>
                    </div>
                    <a href="/practice/random" class="mt-4 flex items-center justify-center gap-2 bg-white/15 hover:bg-white/25 rounded-xl py-2.5 text-sm font-semibold transition-colors">
                        콤보 연습하기 <i class="fa-solid fa-arrow-right text-xs"></i>
                    </a>
                </div>

                <!-- 이번주 과제 + 자기신고 -->
                <div th:if="${thisWeekTask != null}" class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
                    <h2 class="text-sm font-bold text-gray-800 mb-3">이번 주 집중 과제</h2>
                    <form th:action="@{/today/task-done}" method="post" class="flex items-start gap-3">
                        <input type="hidden" name="reportId" th:value="${latestReportId}"/>
                        <input type="hidden" name="done" th:value="${!thisWeekTaskDone}"/>
                        <button type="submit"
                                class="mt-0.5 w-5 h-5 rounded-md border-2 flex items-center justify-center shrink-0 transition-colors"
                                th:classappend="${thisWeekTaskDone} ? 'bg-brand-600 border-brand-600' : 'border-gray-300 hover:border-brand-400'">
                            <i th:if="${thisWeekTaskDone}" class="fa-solid fa-check text-white text-[10px]"></i>
                        </button>
                        <p class="text-sm leading-relaxed"
                           th:text="${thisWeekTask}"
                           th:classappend="${thisWeekTaskDone} ? 'text-gray-400 line-through' : 'text-gray-700'"></p>
                    </form>
                </div>

                <!-- 회피 감지 -->
                <div th:if="${!avoidedTypes.isEmpty()}" class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
                    <h2 class="text-sm font-bold text-gray-800 mb-1">한동안 안 한 유형이 있어요</h2>
                    <p class="text-xs text-gray-400 mb-4">D-day 기준 방치 기간이 길수록 위에 표시돼요</p>
                    <div class="flex flex-col gap-2">
                        <a th:each="t : ${avoidedTypes}"
                           th:href="@{/practice/type(type=${t.typeKey()})}"
                           class="flex items-center justify-between rounded-xl px-4 py-3 transition-colors hover:opacity-90"
                           th:classappend="${t.weak()} ? 'bg-rose-50' : 'bg-gray-50'">
                            <div class="flex items-center gap-2">
                                <span th:if="${t.weak()}" class="text-[10px] bg-rose-100 text-rose-800 px-1.5 py-0.5 rounded font-semibold">약점</span>
                                <span class="text-sm font-semibold text-gray-700" th:text="${t.typeLabel()}"></span>
                            </div>
                            <span class="text-xs text-gray-400" th:text="${t.daysSince()} + '일째 안 함'"></span>
                        </a>
                    </div>
                </div>

                <!-- 이번주 과제/회피 감지 둘 다 없을 때 -->
                <div th:if="${thisWeekTask == null and avoidedTypes.isEmpty()}"
                     class="bg-white rounded-2xl p-6 text-center shadow-sm border border-gray-100">
                    <p class="text-sm text-gray-400">아직 표시할 이번 주 과제나 회피 유형이 없어요.</p>
                </div>

            </div>
        </div>
    </main>
</div>

</body>
</html>
