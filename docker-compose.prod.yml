services:
  mysql:
    image: mysql:8.0
    container_name: opicnic_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: opicnic
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - opicnic_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opicnic_app
    # 힙을 명시하지 않으면 JVM은 MaxRAMPercentage 기본값 25%를 호스트 전체 메모리(24GB)에
    # 적용해 약 6GB까지 잡는다. 이 호스트는 다른 서비스와 공유하므로 컨테이너 한도와 힙을
    # 둘 다 명시해서 JVM이 옆 서비스 몫까지 쓰지 못하게 한다. (5GB 힙 + 약 1GB 비힙)
    mem_limit: 6g
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx5g
      - SPRING_PROFILES_ACTIVE=prod
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DOMAIN=${DOMAIN}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - SPRING_AI_STT_BASE_URL=http://opicnic_stt:8000
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - opicnic_network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: opicnic_nginx
    ports:
      - "127.0.0.1:18080:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - opicnic_network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: opicnic_prometheus
    volumes:
      - ./docker/prometheus/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - opicnic_network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: opicnic_grafana
    environment:
      # SEC-05: 기본값(admin) fallback 제거 — 값이 없거나 비어있으면 compose가 즉시 실패한다.
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?GRAFANA_PASSWORD가 .env에 설정되어야 합니다}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - opicnic_network
    restart: unless-stopped

volumes:
  mysql_data:
  prometheus_data:
  grafana_data:

networks:
  opicnic_network:
    driver: bridge
